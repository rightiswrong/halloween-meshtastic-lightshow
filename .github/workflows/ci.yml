name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: The meshtastic API calls we rely on still exist
        run: |
          python - <<'PY'
          import inspect
          from meshtastic.mesh_interface import MeshInterface
          from meshtastic.serial_interface import SerialInterface
          from meshtastic.tcp_interface import TCPInterface
          sig = inspect.signature(MeshInterface.sendText).parameters
          for p in ("destinationId", "wantAck", "channelIndex"):
              assert p in sig, p
          assert "devPath" in inspect.signature(SerialInterface.__init__).parameters
          assert "hostname" in inspect.signature(TCPInterface.__init__).parameters
          import pubsub  # noqa: F401
          print("meshtastic API ok")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Shell and config syntax
        run: |
          bash -n deploy/edge/install.sh
          bash -n deploy/translator/install.sh
          bash -n deploy/common/lib.sh
          sudo apt-get install -y -q shellcheck
          shellcheck -x --source-path=SCRIPTDIR deploy/edge/install.sh deploy/translator/install.sh deploy/common/lib.sh
          sudo apt-get install -y -q nftables
          sudo nft -c -f deploy/edge/storm-firewall.nft
          python -c "import yaml" 2>/dev/null || pip install pyyaml
          python - <<'PY'
          import yaml
          class L(yaml.SafeLoader): pass
          L.add_constructor("!secret", lambda loader, node: "secret")
          yaml.load(open("homeassistant/packages/storm.yaml"), Loader=L)
          print("HA package parses")
          PY

  audit:
    # Known-vulnerable dependencies. Its own job, so a new advisory never hides test results.
    # Each finding becomes an annotation on the run (readable in the UI and the API).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the app's dependencies and pip-audit
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install --upgrade pip
          /tmp/app/bin/pip install .
          pip install pip-audit
      - name: pip-audit
        run: |
          set +e
          pip-audit --path /tmp/app/lib/python3.12/site-packages --skip-editable --desc off -f json -o audit.json
          code=$?
          python - <<'PY'
          import json, sys
          data = json.load(open("audit.json"))
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          found = 0
          for d in deps:
              for v in d.get("vulns", []):
                  found += 1
                  fix = ", ".join(v.get("fix_versions", [])) or "none yet"
                  print(f"::error title=Vulnerable dependency::{d['name']} {d['version']}: {v['id']} (fixed in: {fix})")
          print(f"{found} known vulnerabilities")
          PY
          exit $code

