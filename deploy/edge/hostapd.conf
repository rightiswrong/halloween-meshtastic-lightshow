# Guest hotspot on the CM4's built-in Wi-Fi -> /etc/hostapd/hostapd.conf
# Open network on purpose: guests should join with one tap. Nothing is reachable
# through it except the Storm page (see storm-firewall.nft).
# To require a password printed on your sign instead (stops casual sniffing and makes
# a fake "evil twin" network a little harder; SECURITY-AUDIT.md F-09), set wpa=2 and:
#   wpa_key_mgmt=WPA-PSK
#   rsn_pairwise=CCMP
#   wpa_passphrase=spooky-season-2026
interface=wlan0
driver=nl80211
ssid=SummonTheStorm
utf8_ssid=1
country_code=US
ieee80211d=1
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=0
# Guests can't see or reach each other.
ap_isolate=1
max_num_sta=48
# Drop clients that stop responding, freeing their slot.
disassoc_low_ack=1
ignore_broadcast_ssid=0
