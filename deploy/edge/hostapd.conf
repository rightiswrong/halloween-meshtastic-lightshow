# Guest hotspot on the CM4's built-in Wi-Fi -> /etc/hostapd/hostapd.conf
# Open network on purpose: guests should join with one tap. Nothing is reachable
# through it except the Storm page (see storm-firewall.nft).
interface=wlan0
driver=nl80211
ssid=SummonTheStorm
utf8_ssid=1
country_code=US
ieee80211d=1
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=0
# Guests can't see or reach each other.
ap_isolate=1
max_num_sta=32
ignore_broadcast_ssid=0
