# Captive DNS + DHCP for the guest hotspot -> /etc/dnsmasq.d/storm.conf
interface=wlan0
bind-interfaces
except-interface=lo
no-resolv
no-hosts
# Every name resolves to this box, so phones' connectivity probes reach the portal.
address=/#/10.66.0.1
# Short leases: abandoned or fake clients free their address quickly (F-09).
dhcp-range=10.66.0.20,10.66.0.250,255.255.255.0,15m
dhcp-option=option:router,10.66.0.1
dhcp-option=option:dns-server,10.66.0.1
# RFC 8910 captive-portal URI: newer phones open the page straight away.
dhcp-option=114,"http://10.66.0.1/"
dhcp-authoritative
# Leases (IP <-> MAC) are what storm-bbs keys guest cooldowns on.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
# Uncomment only while debugging: it logs every guest's device name (F-17).
# log-dhcp
